apiVersion: v1
kind: ServiceAccount
metadata:
  name: worldwave-monitor
  namespace: worldwave-radio
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: worldwave-monitor
  namespace: worldwave-radio
rules:
  - apiGroups: ['']
    resources: [services/proxy]
    resourceNames: ['worldwave-radio:http']
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worldwave-monitor
  namespace: worldwave-radio
subjects:
  - kind: ServiceAccount
    name: worldwave-monitor
    namespace: worldwave-radio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: worldwave-monitor
