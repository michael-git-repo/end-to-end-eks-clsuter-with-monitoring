name: DevSecOps Pipeline

# ==========================================================
# WHEN SHOULD THE PIPELINE RUN?
# ==========================================================

on:
  push:
    branches:
      - main

  # Allows you to run the pipeline manually from GitHub
  workflow_dispatch:


# ==========================================================
# PERMISSIONS
# Needed because the workflow updates deployment.yml
# ==========================================================

permissions:
  contents: write


# ==========================================================
# MAIN PIPELINE
# ==========================================================

jobs:

  devsecops:

    # GitHub provides this Ubuntu machine automatically
    runs-on: ubuntu-latest

    steps:

      # ====================================================
      # 1. DOWNLOAD CODE
      # ====================================================

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ====================================================
      # 2. INSTALL NODE.JS
      # ====================================================

      # SonarQube 9.9 requires an older analyzer runtime.
      # Save its absolute path before selecting Node 24 for the application.
      - name: Setup Node.js 18 for SonarQube
        uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"

      - name: Save SonarQube Node.js path
        id: sonar_node
        run: echo "executable=$(node -p 'process.execPath')" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24 for application
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: worldwave-radio/package-lock.json


      # ====================================================
      # 3. INSTALL APPLICATION PACKAGES
      # ====================================================

      - name: Install dependencies
        working-directory: worldwave-radio
        run: npm ci


      # ====================================================
      # 4. TEST APPLICATION
      # ====================================================

      # Generate real coverage before SonarQube imports it.
      # A failing test stops image publication and deployment.
      - name: Run JavaScript tests with coverage
        working-directory: worldwave-radio
        run: npm run test:coverage

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install coverage==7.10.7 reportlab==5.0.1

      - name: Run Python tests with coverage
        working-directory: worldwave-radio
        run: |
          python -m coverage run -m unittest discover -s test -p '*_test.py'
          python -m coverage xml
          python -m coverage report --fail-under=80 -m
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          files = [item.attrib['filename'] for item in ElementTree.parse('coverage.xml').iter('class')]
          expected = {path.as_posix() for path in Path('scripts').glob('*.py')}
          if set(files) != expected or not all(Path(name).is_file() for name in files):
              raise SystemExit('Coverage XML must identify every Python script by its project-relative scripts/ path.')
          print('Validated Python coverage paths:', ', '.join(files))
          PY

      - name: Save test coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            worldwave-radio/lcov.info
            worldwave-radio/coverage.xml
          retention-days: 30


      # ====================================================
      # 5. SONARQUBE SCAN
      # ====================================================

      # Sends the source code analysis to your SonarQube server.
      - name: SonarQube Scan
        id: sonar_scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: worldwave-radio
          args: >-
            -Dsonar.nodejs.executable=${{ steps.sonar_node.outputs.executable }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


      # sonar.qualitygate.wait=true already checks the gate in the scan step.
      # A failed gate prevents the Docker push and deployment update.

      - name: Export SonarQube report
        if: always()
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 worldwave-radio/scripts/export-sonar-report.py

      # ====================================================
      # 7. LOGIN TO DOCKER HUB
      # ====================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: bleosas
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ====================================================
      # 8. BUILD DOCKER IMAGE
      # ====================================================

      # Each image gets a unique versionN tag and immutable commit-SHA tag.
      - name: Build Docker image
        run: |
          docker build --pull \
          -t bleosas/devsecops-app:${{ github.sha }} \
          -t bleosas/devsecops-app:version${{ github.run_number }} worldwave-radio


      # ====================================================
      # 9. TRIVY SECURITY SCAN
      # ====================================================

      # Scan the Docker image for vulnerabilities.
      # The report is saved as trivy-report.json.
      - name: Trivy Security Scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bleosas/devsecops-app:version${{ github.run_number }}'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
          exit-code: '0'


      # ====================================================
      # 10. SHOW TRIVY REPORT
      # ====================================================

      - name: Show Trivy Report
        if: always()
        run: |
          echo "========== TRIVY REPORT =========="
          cat trivy-report.json || true


      # ====================================================
      # 11. SAVE TRIVY REPORT IN GITHUB
      # ====================================================

      # You can download the report from the GitHub Actions run.
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json
          retention-days: 30


      # ====================================================
      # 12. PUSH DOCKER IMAGE
      # ====================================================

      - name: Push Docker image
        run: |
          docker push \
          bleosas/devsecops-app:${{ github.sha }}
          docker push \
          bleosas/devsecops-app:version${{ github.run_number }}


      # ====================================================
      # 13. UPDATE KUBERNETES IMAGE
      # ====================================================

      # IMPORTANT:
      # Change k8s/deployment.yml below if your Kubernetes
      # deployment file is stored somewhere else.
      #
      # This replaces the old Docker image with the new image.
      - name: Update Kubernetes deployment
        run: |

          sed -i \
          "s|image: .*|image: bleosas/devsecops-app:version${{ github.run_number }}|g" \
          k8s/deployment.yml


      # ====================================================
      # 14. COMMIT UPDATED deployment.yml
      # ====================================================

      # Pushes the new image tag back to GitHub.
      # Argo CD will detect this Git change.
      - name: Commit Kubernetes image update
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/deployment.yml

          git diff --cached --quiet || \
          git commit -m "Update image to version${{ github.run_number }}"

          git push


      - name: Generate white-background PDF reports
        if: always()
        env:
          PIPELINE_STATUS: ${{ job.status }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          TRIVY_SEVERITIES: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          IMAGE_NAME: bleosas/devsecops-app:version${{ github.run_number }}
        run: |
          python3 -m pip install --quiet reportlab==5.0.1
          python3 worldwave-radio/scripts/pdf-reports.py

      - name: Prepare email attachments
        id: attachments
        if: always()
        run: |
          mkdir -p reports
          for report in trivy-report.json sonarqube-report.json; do
            if [ -f "$report" ]; then cp "$report" reports/; fi
          done
          if [ ! -f reports/trivy-report.pdf ] || [ ! -f reports/sonarqube-report.pdf ]; then
            printf 'PDF generation did not complete. Inspect this workflow run; missing data does not mean a clean scan.\n' > reports/report-unavailable.txt
          fi
          printf 'files=%s\n' "$(find reports -maxdepth 1 -type f | sort | paste -sd ',' -)" >> "$GITHUB_OUTPUT"

      - name: Save PDF and JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-pdf-reports
          path: reports/
          retention-days: 30

      # ====================================================
      # 15. EMAIL PIPELINE RESULT
      # ====================================================

      # Runs even when an earlier step fails.
      - name: Send Gmail Notification
        if: always()

        uses: dawidd6/action-send-mail@v6

        with:

          # Gmail SMTP server
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          # Stored safely in GitHub Secrets
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}

          # Email title
          subject: >
            DevSecOps Pipeline - ${{ job.status }}

          # Send the email to yourself
          to: blesosas222@gmail.com

          # Attach PDF summaries for easier reading plus raw JSON/TXT reports for detailed machine data.
          attachments: ${{ steps.attachments.outputs.files }}

          from: GitHub DevSecOps Pipeline

          # Email content
          body: |

            DevSecOps Pipeline Report

            ================================

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            ================================

            Pipeline Status:
            ${{ job.status }}

            ================================

            SonarQube Scan:
            ${{ steps.sonar_scan.outcome }}

            SonarQube Quality Gate:
            Checked during SonarQube Scan; see the attached report for gate conditions.

            SonarQube Dashboard:
            ${{ secrets.SONAR_HOST_URL }}/dashboard?id=worldwave-radio

            ================================

            Trivy Security Scan:
            ${{ steps.trivy.outcome }}

            White-background table PDFs are attached for Trivy, SonarQube, and the security summary.
            Original JSON is attached when available. If generation fails, a report-unavailable.txt notice is attached instead.

            ================================

            Docker Image:

            bleosas/devsecops-app:version${{ github.run_number }}
            bleosas/devsecops-app:${{ github.sha }}

            ================================

            GitHub Actions Report:

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ================================

            If the deployment update was successful,
            Argo CD will detect the new deployment.yml
            and synchronise the application to EKS.
