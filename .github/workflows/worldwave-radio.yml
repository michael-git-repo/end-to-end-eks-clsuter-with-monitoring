name: DevSecOps Pipeline

# ==========================================================
# WHEN SHOULD THE PIPELINE RUN?
# ==========================================================

on:
  push:
    branches:
      - main

  # Allows you to run the pipeline manually from GitHub
  workflow_dispatch:


# ==========================================================
# PERMISSIONS
# Needed because the workflow updates deployment.yml
# ==========================================================

permissions:
  contents: write


# ==========================================================
# MAIN PIPELINE
# ==========================================================

jobs:

  devsecops:

    # GitHub provides this Ubuntu machine automatically
    runs-on: ubuntu-latest

    steps:

      # ====================================================
      # 1. DOWNLOAD CODE
      # ====================================================

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ====================================================
      # 2. INSTALL NODE.JS
      # ====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: worldwave-radio/package-lock.json


      # ====================================================
      # 3. INSTALL APPLICATION PACKAGES
      # ====================================================

      - name: Install dependencies
        working-directory: worldwave-radio
        run: npm ci


      # ====================================================
      # 4. TEST APPLICATION
      # ====================================================

      # If your project does not have npm tests yet,
      # this will not stop the whole pipeline.
      - name: Run tests
        working-directory: worldwave-radio
        run: npm test
        continue-on-error: true


      # ====================================================
      # 5. SONARQUBE SCAN
      # ====================================================

      # Sends the source code analysis to your SonarQube server.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: worldwave-radio
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


      # ====================================================
      # 6. WAIT FOR SONARQUBE QUALITY GATE
      # ====================================================

      # Checks whether the SonarQube Quality Gate passed.
      - name: SonarQube Quality Gate
        id: sonarqube
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: worldwave-radio/.scannerwork/report-task.txt
        timeout-minutes: 5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Export SonarQube report
        if: always()
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ! curl --fail --silent --show-error \
            --user "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/measures/component?component=worldwave-radio&metricKeys=alert_status,bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc" \
            --output sonarqube-report.json; then
            printf '{"message":"SonarQube measures could not be downloaded; see the dashboard.","dashboard":"%s/dashboard?id=worldwave-radio"}\n' "${SONAR_HOST_URL%/}" > sonarqube-report.json
          fi


      # ====================================================
      # 7. LOGIN TO DOCKER HUB
      # ====================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: bleosas
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ====================================================
      # 8. BUILD DOCKER IMAGE
      # ====================================================

      # Each image gets a unique versionN tag and immutable commit-SHA tag.
      - name: Build Docker image
        run: |
          docker build \
          -t bleosas/devsecops-app:${{ github.sha }} \
          -t bleosas/devsecops-app:version${{ github.run_number }} worldwave-radio


      # ====================================================
      # 9. TRIVY SECURITY SCAN
      # ====================================================

      # Scan the Docker image for vulnerabilities.
      # The report is saved as trivy-report.json.
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bleosas/devsecops-app:version${{ github.run_number }}'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'


      # ====================================================
      # 10. SHOW TRIVY REPORT
      # ====================================================

      - name: Show Trivy Report
        if: always()
        run: |
          echo "========== TRIVY REPORT =========="
          cat trivy-report.json || true


      # ====================================================
      # 11. SAVE TRIVY REPORT IN GITHUB
      # ====================================================

      # You can download the report from the GitHub Actions run.
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json
          retention-days: 30


      # ====================================================
      # 12. PUSH DOCKER IMAGE
      # ====================================================

      - name: Push Docker image
        run: |
          docker push \
          bleosas/devsecops-app:${{ github.sha }}
          docker push \
          bleosas/devsecops-app:version${{ github.run_number }}


      # ====================================================
      # 13. UPDATE KUBERNETES IMAGE
      # ====================================================

      # IMPORTANT:
      # Change k8s/deployment.yml below if your Kubernetes
      # deployment file is stored somewhere else.
      #
      # This replaces the old Docker image with the new image.
      - name: Update Kubernetes deployment
        run: |

          sed -i \
          "s|image: .*|image: bleosas/devsecops-app:version${{ github.run_number }}|g" \
          k8s/deployment.yml


      # ====================================================
      # 14. COMMIT UPDATED deployment.yml
      # ====================================================

      # Pushes the new image tag back to GitHub.
      # Argo CD will detect this Git change.
      - name: Commit Kubernetes image update
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/deployment.yml

          git diff --cached --quiet || \
          git commit -m "Update image to version${{ github.run_number }}"

          git push


      - name: Generate PDF reports
        if: always()
        run: |
          python -m pip install --quiet reportlab

          python - <<'PY'
          import json
          import os
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import letter
          from reportlab.lib.styles import getSampleStyleSheet
          from reportlab.platypus import Paragraph, SimpleDocTemplate, Spacer, Table, TableStyle

          repo = "${{ github.repository }}"
          branch = "${{ github.ref_name }}"
          commit = "${{ github.sha }}"
          status = "${{ job.status }}"

          def make_table_pdf(filename, title, rows):
              doc = SimpleDocTemplate(filename, pagesize=letter, leftMargin=40, rightMargin=40, topMargin=40, bottomMargin=40)
              styles = getSampleStyleSheet()
              story = [Paragraph(title, styles['Title']), Spacer(1, 18)]
              table = Table(rows)
              table.setStyle(TableStyle([
                  ('BACKGROUND', (0, 0), (-1, 0), colors.HexColor('#2F4F4F')),
                  ('TEXTCOLOR', (0, 0), (-1, 0), colors.white),
                  ('GRID', (0, 0), (-1, -1), 1, colors.grey),
                  ('FONTNAME', (0, 0), (-1, 0), 'Helvetica-Bold'),
                  ('ALIGN', (1, 1), (-1, -1), 'CENTER'),
                  ('ROWBACKGROUNDS', (0, 1), (-1, -1), [colors.whitesmoke, colors.white]),
                  ('VALIGN', (0, 0), (-1, -1), 'MIDDLE'),
                  ('BOTTOMPADDING', (0, 0), (-1, -1), 6),
                  ('TOPPADDING', (0, 0), (-1, -1), 6),
              ]))
              story.append(table)
              doc.build(story)

          summary_rows = [
              ['Field', 'Value'],
              ['Repository', repo],
              ['Branch', branch],
              ['Commit', commit],
              ['Pipeline Status', status],
          ]

          trivy_rows = [['Severity', 'Count']]
          if os.path.exists('trivy-report.json'):
              try:
                  with open('trivy-report.json', 'r', encoding='utf-8') as f:
                      trivy_data = json.load(f)
                  counts = {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0}
                  for result in trivy_data.get('Results', []):
                      for vuln in result.get('Vulnerabilities', []):
                          sev = (vuln.get('Severity') or 'UNKNOWN').upper()
                          if sev in counts:
                              counts[sev] += 1
                  for sev in ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW']:
                      trivy_rows.append([sev, counts.get(sev, 0)])
              except Exception:
                  trivy_rows.append(['Report error', 'Not readable'])
          else:
              trivy_rows.append(['Report missing', '0'])

          sonarqube_rows = [['Metric', 'Value']]
          if os.path.exists('sonarqube-report.json'):
              try:
                  with open('sonarqube-report.json', 'r', encoding='utf-8') as f:
                      sonar_data = json.load(f)
                  measures = sonar_data.get('component', {}).get('measures', [])
                  if measures:
                      for m in measures:
                          sonarqube_rows.append([m.get('metric', 'unknown'), m.get('value', m.get('bestValue', 'n/a'))])
                  else:
                      sonarqube_rows.append(['Status', 'No measures exported'])
              except Exception:
                  sonarqube_rows.append(['Status', 'Report not readable'])
          else:
              sonarqube_rows.append(['Status', 'Report missing'])

          make_table_pdf('security-summary.pdf', 'Executive Summary', summary_rows)
          make_table_pdf('trivy-report.pdf', 'Trivy Security Summary', trivy_rows)
          make_table_pdf('sonarqube-report.pdf', 'SonarQube Summary', sonarqube_rows)
          PY

      - name: Prepare email attachments
        if: always()
        run: |
          test -f trivy-report.json || printf '{"message":"Trivy report was not generated; inspect the workflow logs."}\n' > trivy-report.json
          test -f sonarqube-report.json || printf '{"message":"SonarQube report was not generated; inspect the workflow logs."}\n' > sonarqube-report.json
          mkdir -p worldwave-radio/.scannerwork
          test -f worldwave-radio/.scannerwork/report-task.txt || printf 'SonarQube scanner metadata was not generated; inspect the workflow logs.\n' > worldwave-radio/.scannerwork/report-task.txt
          test -f security-summary.pdf || printf 'PDF summary unavailable.\n' > security-summary.txt
          test -f trivy-report.pdf || printf 'Trivy PDF summary unavailable.\n' > trivy-report.txt
          test -f sonarqube-report.pdf || printf 'SonarQube PDF summary unavailable.\n' > sonarqube-report.txt


      # ====================================================
      # 15. EMAIL PIPELINE RESULT
      # ====================================================

      # Runs even when an earlier step fails.
      - name: Send Gmail Notification
        if: always()

        uses: dawidd6/action-send-mail@v6

        with:

          # Gmail SMTP server
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          # Stored safely in GitHub Secrets
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}

          # Email title
          subject: >
            DevSecOps Pipeline - ${{ job.status }}

          # Send the email to yourself
          to: ${{ secrets.GMAIL_USERNAME }}

          # Attach PDF summaries for easier reading plus raw JSON/TXT reports for detailed machine data.
          attachments: security-summary.pdf,trivy-report.pdf,sonarqube-report.pdf,trivy-report.json,sonarqube-report.json,worldwave-radio/.scannerwork/report-task.txt

          from: GitHub DevSecOps Pipeline

          # Email content
          body: |

            DevSecOps Pipeline Report

            ================================

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            ================================

            Pipeline Status:
            ${{ job.status }}

            ================================

            SonarQube Scan:
            Completed

            SonarQube Quality Gate:
            ${{ steps.sonarqube.outcome }}

            SonarQube Dashboard:
            ${{ secrets.SONAR_HOST_URL }}/dashboard?id=worldwave-radio

            ================================

            Trivy Security Scan:
            Completed

            PDF files are attached for the executive summary, Trivy overview, and SonarQube overview.
            JSON/TXT reports are attached for raw report data, exact scanner output, and machine-readable details.

            ================================

            Docker Image:

            bleosas/devsecops-app:version${{ github.run_number }}
            bleosas/devsecops-app:${{ github.sha }}

            ================================

            GitHub Actions Report:

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ================================

            If the deployment update was successful,
            Argo CD will detect the new deployment.yml
            and synchronise the application to EKS.